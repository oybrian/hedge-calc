<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HedgeCalc</title>
<style>
:root{
  --bg:#F2F2F7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93;
  --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --sep:#e5e5ea; --press:#e8e8ed;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-size:16px; -webkit-font-smoothing:antialiased;}
#app{max-width:520px; margin:0 auto; padding:0 16px 40px;}
.topbar{display:flex; align-items:flex-end; gap:8px; margin:8px 2px 14px;}
.app-title{font-size:32px; font-weight:800; letter-spacing:-.02em; flex:1; line-height:1.15;}
.card{background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card h3{margin:0 0 12px; font-size:13px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.06em;}
.row{display:flex; gap:10px; margin-bottom:10px;}
.row:last-child{margin-bottom:0;}
.field{flex:1; min-width:0;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
.field input, .field select{
  width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--sep);
  border-radius:10px; background:#fff; color:var(--text); outline:none;}
.field input:focus, .field select:focus{border-color:var(--blue);}
.side{border-left:3px solid var(--sep); padding-left:12px; margin-bottom:16px;}
.side.a{border-color:var(--blue);}
.side.b{border-color:var(--orange);}
.side-title{font-weight:700; font-size:15px; margin-bottom:10px;}
.results{background:#f8f8fa; border-radius:10px; padding:12px 14px; margin-top:12px;}
.rrow{display:flex; justify-content:space-between; padding:5px 0; font-size:15px;}
.rrow .k{color:var(--muted);}
.rrow .v{font-weight:600; font-variant-numeric:tabular-nums;}
.rrow.profit .v{color:var(--green);}
.rrow.loss .v{color:var(--red);}
.rrow.total{border-top:1px solid var(--sep); margin-top:6px; padding-top:10px;}
.badge{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px;
  border-radius:20px; margin-left:8px;}
.badge.ok{background:#e6f9ed; color:#1a7a3a;}
.badge.bad{background:#fdecea; color:#b3261e;}
.btn{display:block; width:100%; padding:13px; font-size:16px; font-weight:600;
  background:var(--blue); color:#fff; border:none; border-radius:12px; cursor:pointer;}
.btn:active{opacity:.85;}
.btn.sec{background:var(--press); color:var(--text); margin-top:8px;}

.small{font-size:12px; color:var(--muted); margin-top:8px;}
.divider{height:1px; background:var(--sep); margin:16px 0;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="app-title">HedgeCalc</div></div>

  <!-- Hedge calculator -->
  <div class="card">
    <h3>Hedge Calculator</h3>
    <div class="side a">
      <div class="side-title">Side A</div>
      <div class="row">
        <div class="field"><label>Book</label>
          <select id="a-book"></select></div>
        <div class="field"><label>Decimal odds</label>
          <input id="a-odds" type="number" step="0.01" min="1.01" value="2.00"></div>
      </div>
      <div class="row">
        <div class="field"><label>Cash stake ($)</label>
          <input id="a-cash" type="number" step="0.01" min="0"></div>
        <div class="field"><label>Bonus stake ($)</label>
          <input id="a-bonus" type="number" step="0.01" min="0" value="0"></div>
        <div class="field"><label>Boost %</label>
          <input id="a-boost" type="number" step="1" min="0" value="0"></div>
      </div>
    </div>
    <div class="side b">
      <div class="side-title">Side B</div>
      <div class="row">
        <div class="field"><label>Book</label>
          <select id="b-book"></select></div>
        <div class="field"><label>Decimal odds</label>
          <input id="b-odds" type="number" step="0.01" min="1.01" value="2.00"></div>
      </div>
      <div class="row">
        <div class="field"><label>Cash stake ($)</label>
          <input id="b-cash" type="number" step="0.01" min="0"></div>
        <div class="field"><label>Bonus stake ($)</label>
          <input id="b-bonus" type="number" step="0.01" min="0" value="0"></div>
        <div class="field"><label>Boost %</label>
          <input id="b-boost" type="number" step="1" min="0" value="0"></div>
      </div>
    </div>
    <button class="btn" id="calc-btn">Calculate</button>
    <div class="results" id="results" style="display:none"></div>
  </div>

  <!-- Quick solver -->
  <div class="card">
    <h3>Quick Solver <span class="small" style="text-transform:none">(cash only, no boost)</span></h3>
    <div class="row">
      <div class="field"><label>Odds A</label>
        <input id="s-odds-a" type="number" step="0.01" min="1.01" value="2.00"></div>
      <div class="field"><label>Odds B</label>
        <input id="s-odds-b" type="number" step="0.01" min="1.01" value="2.00"></div>
      <div class="field"><label>Total cash ($)</label>
        <input id="s-total" type="number" step="0.01" min="0"></div>
    </div>
    <button class="btn sec" id="solve-btn">Solve for equal profit</button>
    <div class="results" id="solver-results" style="display:none"></div>
  </div>


</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const BOOKS=["DraftKings","FanDuel","Fanatics","BetMGM","Bally Bet","Caesar","Polymarket","Other"];


BOOKS.forEach(b=>{
  ["a-book","b-book"].forEach(id=>{
    const o=document.createElement("option"); o.value=b; o.textContent=b; $(id).appendChild(o);
  });
});
$("a-book").value="FanDuel"; $("b-book").value="DraftKings";

/* ---------- hedge math ---------- */
// Cash: stake returned + boosted profit. Bonus: profit only, no boost, stake not returned.
function sideReturn(cash, bonus, odds, boostPct){
  const cashProfit=cash*(odds-1)*(1+boostPct/100);
  const bonusProfit=bonus*(odds-1);
  return cash+cashProfit+bonusProfit;
}
function fmt(n){ return "$"+n.toFixed(2); }
function fmtSigned(n){ return (n>=0?"+":"−")+"$"+Math.abs(n).toFixed(2); }

$("calc-btn").onclick=()=>{
  const A={book:$("a-book").value, odds:parseFloat($("a-odds").value)||0,
    cash:parseFloat($("a-cash").value)||0, bonus:parseFloat($("a-bonus").value)||0,
    boost:parseFloat($("a-boost").value)||0};
  const B={book:$("b-book").value, odds:parseFloat($("b-odds").value)||0,
    cash:parseFloat($("b-cash").value)||0, bonus:parseFloat($("b-bonus").value)||0,
    boost:parseFloat($("b-boost").value)||0};
  if(A.odds<1.01||B.odds<1.01){ alert("Enter valid decimal odds (≥1.01) for both sides."); return; }
  const totalCash=A.cash+B.cash;
  const retA=sideReturn(A.cash,A.bonus,A.odds,A.boost);
  const retB=sideReturn(B.cash,B.bonus,B.odds,B.boost);
  const pA=retA-totalCash, pB=retB-totalCash;
  const ok=pA>0&&pB>0;
  const box=$("results"); box.style.display="block";
  // Breakdown per side
  const aCashRet=A.cash+A.cash*(A.odds-1)*(1+A.boost/100);
  const aBonusRet=A.bonus*(A.odds-1);
  const bCashRet=B.cash+B.cash*(B.odds-1)*(1+B.boost/100);
  const bBonusRet=B.bonus*(B.odds-1);
  box.innerHTML=`
    <div class="rrow"><span class="k">Total cash staked</span><span class="v">${fmt(totalCash)}</span></div>
    <div class="rrow"><span class="k">Bonus staked (free)</span><span class="v">${fmt(A.bonus+B.bonus)}</span></div>
    <div class="divider"></div>
    <div class="rrow"><span class="k"><b>Side A</b> (${A.book} @ ${A.odds})</span><span></span></div>
    <div class="rrow"><span class="k" style="padding-left:12px">Cash ${fmt(A.cash)} →</span><span class="v">${fmt(aCashRet)}</span></div>
    ${A.bonus>0?`<div class="rrow"><span class="k" style="padding-left:12px">Bonus ${fmt(A.bonus)} →</span><span class="v">${fmt(aBonusRet)}</span></div>`:""}
    <div class="rrow"><span class="k" style="padding-left:12px">Total return</span><span class="v">${fmt(retA)}</span></div>
    <div class="rrow ${pA>=0?'profit':'loss'}"><span class="k" style="padding-left:12px">Profit</span><span class="v">${fmtSigned(pA)}</span></div>
    <div class="divider"></div>
    <div class="rrow"><span class="k"><b>Side B</b> (${B.book} @ ${B.odds})</span><span></span></div>
    <div class="rrow"><span class="k" style="padding-left:12px">Cash ${fmt(B.cash)} →</span><span class="v">${fmt(bCashRet)}</span></div>
    ${B.bonus>0?`<div class="rrow"><span class="k" style="padding-left:12px">Bonus ${fmt(B.bonus)} →</span><span class="v">${fmt(bBonusRet)}</span></div>`:""}
    <div class="rrow"><span class="k" style="padding-left:12px">Total return</span><span class="v">${fmt(retB)}</span></div>
    <div class="rrow ${pB>=0?'profit':'loss'}"><span class="k" style="padding-left:12px">Profit</span><span class="v">${fmtSigned(pB)}</span></div>
    <div class="divider"></div>
    <div class="rrow total"><span class="k">Guaranteed<span class="badge ${ok?'ok':'bad'}">${ok?'YES':'NO'}</span></span>
      <span class="v">${fmt(Math.min(pA,pB))} worst case</span></div>`;
};

/* ---------- quick solver ---------- */
$("solve-btn").onclick=()=>{
  const oa=parseFloat($("s-odds-a").value)||0, ob=parseFloat($("s-odds-b").value)||0;
  const S=parseFloat($("s-total").value)||0;
  if(oa<1.01||ob<1.01||S<=0){ alert("Enter valid odds and total cash."); return; }
  // Equal profit: stakeA*oa = stakeB*ob, stakeA+stakeB=S
  const sa=S*ob/(oa+ob), sb=S*oa/(oa+ob);
  const profit=sa*oa-S;
  const box=$("solver-results"); box.style.display="block";
  const ok=profit>0;
  box.innerHTML=`
    <div class="rrow"><span class="k">Stake on A @ ${oa}</span><span class="v">${fmt(sa)}</span></div>
    <div class="rrow"><span class="k">Stake on B @ ${ob}</span><span class="v">${fmt(sb)}</span></div>
    <div class="rrow ${profit>=0?'profit':'loss'} total"><span class="k">Profit either way<span class="badge ${ok?'ok':'bad'}">${ok?'YES':'NO'}</span></span>
      <span class="v">${fmtSigned(profit)}</span></div>
    ${ok?"":'<div class="small">No guaranteed profit at these odds — the books have too much margin.</div>'}`;
  // Fill into main calculator
  $("a-odds").value=oa; $("b-odds").value=ob;
  $("a-cash").value=sa.toFixed(2); $("b-cash").value=sb.toFixed(2);
  $("a-bonus").value=""; $("b-bonus").value="";
  $("a-boost").value=""; $("b-boost").value="";
};

</script>
</body>
</html>
